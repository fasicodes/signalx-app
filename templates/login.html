<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals FM — Login</title>
<link rel="stylesheet" href="/static/style.css?v=20260804-ind-1">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, rgba(245,166,35,0.06), transparent 60%), var(--void);
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px 28px;
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .auth-brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  .auth-brand span { font-family: var(--heading); font-size: 20px; font-weight: 600; color: var(--text); }
  .auth-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
  .auth-tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--panel-raised); border-radius: 8px; padding: 4px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px 0; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.4px; color: var(--text-dim); border-radius: 6px; cursor: pointer; user-select: none; }
  .auth-tab.active { background: var(--accent); color: var(--void); }
  .auth-field { margin-bottom: 14px; }
  .auth-field label { display: block; font-family: var(--mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.4px; margin-bottom: 6px; }
  .auth-field input {
    width: 100%; box-sizing: border-box; background: var(--panel-raised); border: 1px solid var(--line);
    border-radius: 6px; padding: 11px 12px; color: var(--text); font-family: var(--body, inherit); font-size: 14px;
  }
  .auth-field input:focus { outline: none; border-color: var(--accent); }
  .auth-submit {
    width: 100%; margin-top: 8px; padding: 12px 0; background: var(--accent); color: var(--void);
    border: none; border-radius: 6px; font-family: var(--mono); font-weight: 700; font-size: 13px;
    letter-spacing: 0.4px; cursor: pointer;
  }
  .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .auth-msg.error { color: #f5615c; }
  .auth-msg.ok { color: var(--long, #36e0a0); }
  .auth-form { display: none; }
  .auth-form.active { display: block; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand"><span class="dot"></span><span>Signals FM</span></div>
    <div class="auth-sub">Apne account mein login karein ya naya banayein</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login">LOGIN</div>
      <div class="auth-tab" id="tab-signup">SIGN UP</div>
    </div>

    <form class="auth-form active" id="login-form">
      <div class="auth-field">
        <label>USERNAME</label>
        <input type="text" id="login-username" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label>PASSWORD</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit" id="login-btn">LOGIN</button>
    </form>

    <form class="auth-form" id="signup-form">
      <div class="auth-field">
        <label>USERNAME</label>
        <input type="text" id="signup-username" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label>PASSWORD</label>
        <input type="password" id="signup-password" autocomplete="new-password" required>
      </div>
      <div class="auth-field">
        <label>CONFIRM PASSWORD</label>
        <input type="password" id="signup-confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="auth-submit" id="signup-btn">CREATE ACCOUNT</button>
    </form>

    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<script>
const tabLogin = document.getElementById('tab-login');
const tabSignup = document.getElementById('tab-signup');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const msg = document.getElementById('auth-msg');

function showTab(which) {
  msg.textContent = '';
  msg.className = 'auth-msg';
  if (which === 'login') {
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    loginForm.classList.add('active'); signupForm.classList.remove('active');
  } else {
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    signupForm.classList.add('active'); loginForm.classList.remove('active');
  }
}
tabLogin.addEventListener('click', () => showTab('login'));
tabSignup.addEventListener('click', () => showTab('signup'));

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  msg.className = 'auth-msg'; msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('login-username').value.trim(),
        password: document.getElementById('login-password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Login fail ho gaya';
      msg.classList.add('error');
    } else {
      msg.textContent = 'Login successful — redirect ho raha hai...';
      msg.classList.add('ok');
      window.location.href = '/';
    }
  } catch (err) {
    msg.textContent = 'Server se connect nahi ho saka';
    msg.classList.add('error');
  } finally {
    btn.disabled = false;
  }
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signup-btn');
  const pw = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  msg.className = 'auth-msg'; msg.textContent = '';

  if (pw !== confirm) {
    msg.textContent = 'Password match nahi ho raha';
    msg.classList.add('error');
    return;
  }

  btn.disabled = true;
  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('signup-username').value.trim(),
        password: pw,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Account nahi ban saka';
      msg.classList.add('error');
    } else {
      msg.textContent = 'Account ban gaya! Ab login karein.';
      msg.classList.add('ok');
      showTab('login');
      document.getElementById('login-username').value = document.getElementById('signup-username').value;
    }
  } catch (err) {
    msg.textContent = 'Server se connect nahi ho saka';
    msg.classList.add('error');
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
