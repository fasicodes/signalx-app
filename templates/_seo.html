{# Social preview + canonical tags. Pages can set seo_title, seo_description and seo_path before including. #}
{% set _base = (site_url or request.url_root) | trim('/') %}
{% set _path = seo_path or request.path %}
<link rel="canonical" href="{{ _base }}{{ _path }}">
<meta name="theme-color" content="#05080a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Signals FM">
<meta property="og:title" content="{{ seo_title or 'Signals FM' }}">
<meta property="og:description" content="{{ seo_description or 'Quantitative crypto signals with an honest confidence score, a public track record, demo trading and free trading calculators.' }}">
<meta property="og:url" content="{{ _base }}{{ _path }}">
<meta property="og:image" content="{{ _base }}{{ url_for('static', filename='og-image.png') }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title or 'Signals FM' }}">
<meta name="twitter:description" content="{{ seo_description or 'Quantitative crypto signals with an honest confidence score.' }}">
<meta name="twitter:image" content="{{ _base }}{{ url_for('static', filename='og-image.png') }}">
{% include '_analytics.html' ignore missing %}
