<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals FM — Demo Trading</title>
<link rel="stylesheet" href="/static/style.css?v=20260804-ind-1">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Page overrides on top of style.css ──────────────── */
body { align-items: stretch; }

.demo-wrap {
  max-width: 1120px; margin: 0 auto;
  padding: 28px 24px 72px; width: 100%;
}

/* ── Top bar ─────────────────────────────────────────── */
.demo-topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
}
.demo-heading {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--heading); font-size: 20px; font-weight: 700;
  color: var(--text); margin: 0;
}
.demo-heading img { height: 26px; width: auto; }
.badge-sim {
  font-family: var(--mono); font-size: 9.5px; font-weight: 800;
  letter-spacing: .6px; text-transform: uppercase;
  color: var(--wait); background: var(--wait-dim);
  border: 1px solid rgba(255,200,87,.2);
  padding: 4px 10px; border-radius: 6px;
}
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text-dim);
  text-decoration: none; border: 1px solid var(--line);
  padding: 7px 14px; border-radius: 7px;
  transition: color .15s, border-color .15s;
}
.back-link:hover { color: var(--text); border-color: var(--line-soft); }

/* ── Layout grid ─────────────────────────────────────── */
.demo-grid {
  display: grid; grid-template-columns: 1.35fr 1fr;
  gap: 20px; align-items: start;
}
@media (max-width: 880px) { .demo-grid { grid-template-columns: 1fr; } }

/* ── Panel card ──────────────────────────────────────── */
.demo-panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 22px;
}
.demo-panel-title {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .7px; text-transform: uppercase;
  color: var(--text-faint); margin: 0 0 18px;
}

/* ── Live prices list ────────────────────────────────── */
.coin-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--line-soft);
}
.coin-row:last-child { border-bottom: none; }
.coin-left { display: flex; align-items: center; gap: 8px; }
.coin-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--panel-raised); display: flex; align-items: center;
  justify-content: center; font-family: var(--mono); font-size: 8px;
  font-weight: 800; color: var(--text-dim); flex-shrink: 0;
}
.coin-name { font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--text); }
.coin-price { font-family: var(--mono); font-size: 13px; color: var(--text); font-weight: 600; }
.coin-change { font-family: var(--mono); font-size: 11.5px; font-weight: 700; }
.coin-change.pos { color: var(--long); }
.coin-change.neg { color: var(--short); }

/* ── Stats row ───────────────────────────────────────── */
.balance-row {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 10px; margin-bottom: 20px;
}
.bstat {
  background: var(--panel-raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 14px;
}
.bstat .k {
  font-family: var(--mono); font-size: 9px; text-transform: uppercase;
  letter-spacing: .5px; color: var(--text-faint);
}
.bstat .v { font-family: var(--mono); font-size: 16px; font-weight: 800; margin-top: 4px; }

/* ── Form controls ───────────────────────────────────── */
.field-label {
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  letter-spacing: .5px; text-transform: uppercase;
  color: var(--text-dim); display: block; margin-bottom: 6px;
}
.demo-select, .demo-input {
  width: 100%; background: var(--panel-raised); border: 1px solid var(--line);
  border-radius: 8px; color: var(--text); padding: 10px 12px;
  font-family: var(--mono); font-size: 13px; margin-bottom: 14px;
  outline: none; transition: border-color .2s;
  -webkit-appearance: none; appearance: none;
}
.demo-select:focus, .demo-input:focus { border-color: var(--long); }

/* ── Trade buttons ───────────────────────────────────── */
.trade-btns { display: flex; gap: 10px; }
.trade-btns button {
  flex: 1; padding: 12px 0; border-radius: 9px; border: none;
  font-family: var(--mono); font-weight: 800; font-size: 12.5px;
  letter-spacing: .4px; cursor: pointer; transition: filter .18s, transform .12s;
}
.trade-btns button:hover { filter: brightness(1.1); }
.trade-btns button:active { transform: scale(.97); }
.btn-buy  { background: var(--long);  color: #051a10; }
.btn-sell { background: var(--short); color: #1f0409; }

/* ── Trade feedback ──────────────────────────────────── */
.trade-msg { font-family: var(--mono); font-size: 11.5px; margin-top: 10px; min-height: 16px; }
.trade-msg.ok    { color: var(--long); }
.trade-msg.error { color: var(--short); }

/* ── Positions table ─────────────────────────────────── */
.pos-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
.pos-table th {
  text-align: left; color: var(--text-faint); font-size: 9.5px;
  text-transform: uppercase; letter-spacing: .5px; padding-bottom: 10px; font-weight: 700;
}
.pos-table td { padding: 9px 0; border-top: 1px solid var(--line-soft); color: var(--text); }
.pos-empty { color: var(--text-faint); font-family: var(--mono); font-size: 12px; padding: 20px 0; text-align: center; }

.reset-link {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .3px;
  color: var(--text-faint); text-decoration: none; cursor: pointer;
  transition: color .15s;
}
.reset-link:hover { color: var(--short); }
</style>
</head>
<body>

<div class="demo-wrap">
  <!-- Top bar -->
  <div class="demo-topbar">
    <h1 class="demo-heading">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="">
      Demo Trading
      <span class="badge-sim">SIMULATED · NOT REAL MONEY</span>
    </h1>
    <a href="/" class="back-link">← Back to dashboard</a>
  </div>

  <div class="demo-grid">

    <!-- Live prices -->
    <div class="demo-panel">
      <div class="demo-panel-title">Live Prices</div>
      <div id="coin-list"><div class="pos-empty">Loading live prices…</div></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">

      <!-- Portfolio stats + trade form -->
      <div class="demo-panel">
        <div class="demo-panel-title">Demo Portfolio</div>
        <div class="balance-row">
          <div class="bstat">
            <div class="k">Cash (USD)</div>
            <div class="v" id="stat-cash">$0.00</div>
          </div>
          <div class="bstat">
            <div class="k">Holdings</div>
            <div class="v" id="stat-holdings">$0.00</div>
          </div>
          <div class="bstat">
            <div class="k">Total P/L</div>
            <div class="v" id="stat-pl">$0.00</div>
          </div>
        </div>

        <label class="field-label">Select Coin</label>
        <select class="demo-select" id="trade-coin"></select>

        <label class="field-label">Amount (USD)</label>
        <input class="demo-input" type="number" id="trade-amount" placeholder="e.g. 500" min="1" step="0.01">

        <div class="trade-btns">
          <button class="btn-buy"  id="buy-btn">▲ BUY</button>
          <button class="btn-sell" id="sell-btn">▼ SELL</button>
        </div>
        <div class="trade-msg" id="trade-msg"></div>
      </div>

      <!-- Open positions -->
      <div class="demo-panel">
        <div class="demo-panel-title">Your Positions</div>
        <table class="pos-table" id="positions-table">
          <thead>
            <tr>
              <th>Coin</th><th>Qty</th><th>Avg Cost</th><th>Value</th>
            </tr>
          </thead>
          <tbody id="positions-body"></tbody>
        </table>
        <div style="text-align:right;margin-top:14px;">
          <a class="reset-link" id="reset-link">↺ Reset portfolio</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  // Apply saved theme (shared with rest of site)
  document.documentElement.setAttribute('data-theme', localStorage.getItem('signalsfm-theme') || 'dark');

  const STORAGE_KEY = 'signalsfm-demo-portfolio';
  const STARTING_CASH = 10000;

  function loadPortfolio() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { cash: STARTING_CASH, positions: {} }; // positions: { BTC: { qty, avgCost } }
  }
  function savePortfolio(p) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
  }

  let portfolio = loadPortfolio();
  let livePrices = {}; // { BTC: { last, changePercent } }

  async function fetchPrices() {
    try {
      const res = await fetch('/ticker');
      const data = await res.json();
      livePrices = {};
      data.forEach(c => { livePrices[c.symbol] = c; });
      renderCoinList();
      renderTradeSelect();
      renderPositions();
    } catch (e) {
      document.getElementById('coin-list').innerHTML = '<div class="empty-state">Could not load live prices.</div>';
    }
  }

  function renderCoinList() {
    const symbols = Object.keys(livePrices);
    if (!symbols.length) return;
    document.getElementById('coin-list').innerHTML = symbols.map(sym => {
      const c = livePrices[sym];
      const chg = c.changePercent;
      const chgClass = chg >= 0 ? 'pos' : 'neg';
      const chgText = (chg >= 0 ? '+' : '') + (chg !== null && chg !== undefined ? chg.toFixed(2) : '0.00') + '%';
      return `<div class="coin-row">
                <span class="coin-name">${sym}</span>
                <span class="coin-price">$${Number(c.last).toLocaleString(undefined,{maximumFractionDigits:2})}</span>
                <span class="coin-change ${chgClass}">${chgText}</span>
              </div>`;
    }).join('');
  }

  function renderTradeSelect() {
    const sel = document.getElementById('trade-coin');
    const symbols = Object.keys(livePrices);
    if (!symbols.length || sel.options.length) return;
    sel.innerHTML = symbols.map(s => `<option value="${s}">${s}/USD</option>`).join('');
  }

  function renderStats() {
    let holdingsValue = 0;
    Object.entries(portfolio.positions).forEach(([sym, pos]) => {
      const price = livePrices[sym] ? livePrices[sym].last : pos.avgCost;
      holdingsValue += pos.qty * price;
    });
    const total = portfolio.cash + holdingsValue;
    const pl = total - STARTING_CASH;
    document.getElementById('stat-cash').textContent = '$' + portfolio.cash.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
    document.getElementById('stat-holdings').textContent = '$' + holdingsValue.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
    const plEl = document.getElementById('stat-pl');
    plEl.textContent = (pl >= 0 ? '+$' : '-$') + Math.abs(pl).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
    plEl.style.color = pl >= 0 ? 'var(--long)' : 'var(--short)';
  }

  function renderPositions() {
    const body = document.getElementById('positions-body');
    const entries = Object.entries(portfolio.positions).filter(([,p]) => p.qty > 0);
    if (!entries.length) {
      body.innerHTML = '';
      document.getElementById('positions-table').style.display = 'none';
      const panel = body.closest('.panel');
      if (!panel.querySelector('.empty-state')) {
        const div = document.createElement('div');
        div.className = 'empty-state';
        div.textContent = 'No open positions yet — place a demo trade to get started.';
        panel.appendChild(div);
      }
    } else {
      document.getElementById('positions-table').style.display = 'table';
      const existingEmpty = body.closest('.panel').querySelector('.empty-state');
      if (existingEmpty) existingEmpty.remove();
      body.innerHTML = entries.map(([sym, pos]) => {
        const price = livePrices[sym] ? livePrices[sym].last : pos.avgCost;
        const value = pos.qty * price;
        return `<tr>
                  <td>${sym}</td>
                  <td>${pos.qty.toFixed(6)}</td>
                  <td>$${pos.avgCost.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
                  <td>$${value.toLocaleString(undefined,{maximumFractionDigits:2})}</td>
                </tr>`;
      }).join('');
    }
    renderStats();
  }

  function showMsg(text, ok) {
    const el = document.getElementById('trade-msg');
    el.textContent = text;
    el.className = 'trade-msg ' + (ok ? 'ok' : 'error');
  }

  document.getElementById('buy-btn').addEventListener('click', () => {
    const sym = document.getElementById('trade-coin').value;
    const usd = parseFloat(document.getElementById('trade-amount').value);
    if (!sym || !usd || usd <= 0) { showMsg('Enter a valid USD amount.', false); return; }
    if (usd > portfolio.cash) { showMsg('Not enough demo cash.', false); return; }
    const price = livePrices[sym].last;
    const qty = usd / price;
    const pos = portfolio.positions[sym] || { qty: 0, avgCost: price };
    const newQty = pos.qty + qty;
    pos.avgCost = ((pos.qty * pos.avgCost) + (qty * price)) / newQty;
    pos.qty = newQty;
    portfolio.positions[sym] = pos;
    portfolio.cash -= usd;
    savePortfolio(portfolio);
    renderPositions();
    showMsg(`Bought ${qty.toFixed(6)} ${sym} at $${price.toLocaleString()}.`, true);
  });

  document.getElementById('sell-btn').addEventListener('click', () => {
    const sym = document.getElementById('trade-coin').value;
    const usd = parseFloat(document.getElementById('trade-amount').value);
    const pos = portfolio.positions[sym];
    if (!usd || usd <= 0) { showMsg('Enter a valid USD amount.', false); return; }
    if (!pos || pos.qty <= 0) { showMsg('You have no position in this coin.', false); return; }
    const price = livePrices[sym].last;
    const qtyToSell = usd / price;
    if (qtyToSell > pos.qty) { showMsg('You cannot sell more than you hold.', false); return; }
    pos.qty -= qtyToSell;
    portfolio.cash += usd;
    savePortfolio(portfolio);
    renderPositions();
    showMsg(`Sold ${qtyToSell.toFixed(6)} ${sym} at $${price.toLocaleString()}.`, true);
  });

  document.getElementById('reset-link').addEventListener('click', () => {
    if (confirm('Reset your demo portfolio back to $10,000?')) {
      portfolio = { cash: STARTING_CASH, positions: {} };
      savePortfolio(portfolio);
      renderPositions();
      showMsg('Portfolio reset.', true);
    }
  });

  fetchPrices();
  setInterval(fetchPrices, 12000);
  renderStats();
</script>

</body>
</html>
