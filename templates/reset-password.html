<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals FM — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --void:#070a0f; --panel:#11161e; --panel-raised:#151b24; --line:#27303b; --text:#e9eef5; --text-dim:#8b96a5; --text-faint:#566171; --accent:#f5a623; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--void); font-family:"Poppins",sans-serif; color:var(--text); }
  .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:var(--text-dim); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; background:var(--panel-raised); border:1px solid var(--line); border-radius:8px; padding:11px 12px; color:var(--text); font-size:14px; margin-bottom:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; padding:12px 0; background:var(--accent); color:var(--void); border:none; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  .msg.error { color:#f5615c; }
  .msg.ok { color:#36e0a0; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Set new password</h1>
    <p class="sub">Enter a new password for your account</p>
    <form id="reset-form">
      <label>New password</label>
      <input type="password" id="new-password" placeholder="At least 8 characters" required>
      <label>Confirm password</label>
      <input type="password" id="confirm-password" placeholder="Re-enter password" required>
      <button type="submit" id="reset-btn">Reset password</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
const form = document.getElementById('reset-form');
const msg = document.getElementById('msg');

if (!token) {
  msg.textContent = 'Invalid or missing reset link.';
  msg.classList.add('error');
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;
  msg.textContent = ''; msg.className = 'msg';

  if (pw !== confirm) {
    msg.textContent = 'Passwords do not match';
    msg.classList.add('error');
    return;
  }

  const btn = document.getElementById('reset-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent = data.error || 'Could not reset password';
      msg.classList.add('error');
    } else {
      msg.textContent = 'Password reset! Redirecting to login...';
      msg.classList.add('ok');
      setTimeout(() => window.location.href = '/login', 1500);
    }
  } catch (err) {
    msg.textContent = 'Could not connect to the server';
    msg.classList.add('error');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
