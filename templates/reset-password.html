<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals FM — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#06090c; --surface:#0f151c; --surface2:#141c26; --border:#1e2a38; --border2:#263548;
  --text:#dce8f5; --text2:#7a93aa; --text3:#3d5268;
  --green:#00e5a0; --green-dim:rgba(0,229,160,.12); --red:#ff4d6a;
  --mono:"IBM Plex Mono",monospace; --display:"Syne",sans-serif; --body:"Inter",sans-serif;
}
html[data-theme="light"] {
  --bg:#f0f4f8; --surface:#ffffff; --surface2:#f4f7fb; --border:#d1dce8; --border2:#b8c8d8;
  --text:#0d1f2d; --text2:#4a6070; --text3:#8fa4b4;
  --green:#00995f; --green-dim:rgba(0,153,95,.1);
}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);font-family:var(--body);
  -webkit-font-smoothing:antialiased;padding:24px;
}
.card{
  width:100%;max-width:400px;
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:38px 32px 30px;position:relative;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.card::before{
  content:"";position:absolute;top:-80px;left:-60px;width:260px;height:260px;
  background:radial-gradient(circle,rgba(0,229,160,.18),transparent 65%);
  pointer-events:none;
}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:28px;position:relative;}
.brand img{height:30px;width:auto;}
.brand-name{font-family:var(--display);font-size:16px;font-weight:800;color:var(--text);}
.card-title{font-family:var(--display);font-size:24px;font-weight:800;margin:0 0 6px;position:relative;letter-spacing:-.4px;}
.card-sub{color:var(--text2);font-size:13.5px;margin:0 0 26px;position:relative;}
.field{margin-bottom:14px;position:relative;}
.field label{display:block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--text2);margin-bottom:7px;text-transform:uppercase;}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);font-family:var(--body);
  font-size:14.5px;outline:none;transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:var(--text3);}
.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,229,160,.1);}
.submit-btn{
  width:100%;margin-top:6px;padding:13px 0;
  background:var(--green);color:#02130b;border:none;border-radius:10px;
  font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:.4px;
  cursor:pointer;transition:filter .18s,box-shadow .18s;
  box-shadow:0 0 22px rgba(0,229,160,.2);
}
.submit-btn:hover{filter:brightness(1.08);box-shadow:0 0 32px rgba(0,229,160,.3);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;filter:none;box-shadow:none;}
.msg{margin-top:14px;font-family:var(--mono);font-size:12px;text-align:center;min-height:18px;line-height:1.5;}
.msg.error{color:var(--red);}
.msg.ok{color:var(--green);}
.back-link{display:block;text-align:center;margin-top:18px;font-family:var(--mono);font-size:11.5px;color:var(--text2);text-decoration:none;transition:color .15s;}
.back-link:hover{color:var(--text);}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Signals FM">
    <span class="brand-name">Signals FM</span>
  </div>

  <h1 class="card-title">Set new password</h1>
  <p class="card-sub">Enter a strong new password for your account.</p>

  <form id="reset-form">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="At least 8 characters" required>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Re-enter your password" required>
    </div>
    <button type="submit" class="submit-btn" id="reset-btn">Reset Password</button>
  </form>

  <div class="msg" id="msg"></div>
  <a href="/login" class="back-link">← Back to login</a>
</div>

<script>
(function(){
  document.documentElement.setAttribute('data-theme', localStorage.getItem('signalsfm-theme') || 'dark');

  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token') || '';
  const form   = document.getElementById('reset-form');
  const msg    = document.getElementById('msg');

  if (!token) {
    msg.textContent = 'Invalid or missing reset link.';
    msg.classList.add('error');
    form.style.display = 'none';
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw      = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    msg.textContent = ''; msg.className = 'msg';

    if (pw !== confirm) {
      msg.textContent = 'Passwords do not match.';
      msg.classList.add('error');
      return;
    }

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    try {
      const res  = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json();
      if (!res.ok) {
        msg.textContent = data.error || 'Could not reset password.';
        msg.classList.add('error');
      } else {
        msg.textContent = 'Password reset! Redirecting to login…';
        msg.classList.add('ok');
        setTimeout(() => window.location.href = '/login', 1500);
      }
    } catch {
      msg.textContent = 'Could not connect to the server.';
      msg.classList.add('error');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
